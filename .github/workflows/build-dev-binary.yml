name: Build dev binary

# Compila el binario en cada push a `dev` y commitea el artefacto a la rama
# `binarios-dev` del mismo repo. Asi `install.sh SMNG_FROM_BRANCH=dev` puede
# bajar el ultimo binario de dev con `curl` desde raw.githubusercontent.com,
# sin pasar por Releases taggeados (modo dev, sin GPG, se sobreescribe).

on:
  push:
    branches:
      - dev

permissions:
  contents: write  # necesario para pushear a la rama binarios-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Build binario estatico
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION="dev-${COMMIT}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o security-manager-ng .

      - name: Generar SHA256
        run: sha256sum security-manager-ng > security-manager-ng.sha256

      - name: Checkout rama binarios-dev
        uses: actions/checkout@v4
        with:
          ref: binarios-dev
          path: binarios-dev
          fetch-depth: 1

      - name: Publicar binario en binarios-dev
        run: |
          cd binarios-dev
          cp ../security-manager-ng ./security-manager-ng
          cp ../security-manager-ng.sha256 ./security-manager-ng.sha256
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-manager-ng security-manager-ng.sha256
          if git diff --staged --quiet; then
            echo "Sin cambios en el binario (commit identico al anterior). Nada que hacer."
            exit 0
          fi
          git commit -m "binario dev-${COMMIT}: build de $(git log -1 --format='%h %s' HEAD~1 || echo 'init')"
          git push origin binarios-dev
          echo "Binario actualizado en binarios-dev."
