name: Build dev binary

# Compila el binario en cada push a `dev` y lo sube como artifact de GitHub Actions.
# NO crea ramas nuevas, NO hace releases. Solo el artifact que Freddy descarga
# desde la UI web (Actions > Build dev binary > run > Artifacts) o via gh CLI.
# Politica: solo `dev` y `main` tienen CI/CD en este repo. No se crean ramas
# auxiliares.

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # permite correr manualmente desde la UI

permissions:
  contents: read  # solo lectura, NO se commitea nada

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Build binario estatico
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION="dev-${COMMIT}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o security-manager-ng .

      - name: Generar SHA256
        run: sha256sum security-manager-ng > security-manager-ng.sha256

      - name: Subir artifact (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: sm-ng-dev-${{ env.VERSION }}
          path: |
            security-manager-ng
            security-manager-ng.sha256
          retention-days: 90
          if-no-files-found: error
