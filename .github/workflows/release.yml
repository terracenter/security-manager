name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Build binario estático
        run: |
          VERSION=$(git describe --tags --always --dirty)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o security-manager-ng .

      - name: Generar checksum
        run: sha256sum security-manager-ng > security-manager-ng.sha256

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            ⚠️ **Release candidate — en validación activa, reporta bugs.**

            Este binario está firmado manualmente por el mantenedor después de esta build automática
            (la llave privada de firma nunca toca CI/CD). La firma (`security-manager-ng.asc`) se
            adjunta a este Release como asset adicional una vez publicado — si no la ves todavía,
            espera unos minutos o revisa que el mantenedor ya la subió antes de confiar en el binario.

            Verificación antes de instalar: ver sección "Instalación desde GitHub Releases" del
            `README.md`.
          files: |
            security-manager-ng
            security-manager-ng.sha256
