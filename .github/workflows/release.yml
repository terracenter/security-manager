name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"

      - name: Build binario estático
        run: |
          VERSION=$(git describe --tags --always --dirty)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o security-manager-ng .

      - name: Generar checksum
        run: sha256sum security-manager-ng > security-manager-ng.sha256

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            security-manager-ng
            security-manager-ng.sha256
